services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NODE_EXTRA_CA_CERTS: /run/certs/postgres-ca.crt
    volumes:
      - ./certs/postgres-ca.crt:/run/certs/postgres-ca.crt:ro
    ports:
      - "127.0.0.1:3090:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
